<!DOCTYPE html>
<html lang="he" dir="rtl" class="quiz-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="New School">
    <meta name="robots" content="index,follow">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="he_IL">
    <title>New School – בודקים הבנה בתכנון למידה</title>
    <meta
      name="description"
      content="בודקים הבנה בתכנון למידה: פעילות עצמאית ביחידת מתכננים למידה לבוחן."
    >
    <meta name="keywords" content="בודקים הבנה בתכנון למידה, פעילות, למידה">
    <meta property="og:title" content="בודקים הבנה בתכנון למידה | New School">
    <meta property="og:description" content="פעילות קצרה לתכנון למידה לבוחן.">
    <link rel="icon" href="../assets/images/logo.svg">
    <link rel="stylesheet" href="../assets/vendor/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/styles.css?v=quiz-cursor-7">
  </head>

  <body class="activity-body quiz-body">
    <svg class="pencil-filter" aria-hidden="true" focusable="false" width="0" height="0">
      <defs><filter id="pencil-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="8" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
    </svg>
    <main class="activity-main">
      <h1 class="activity-title">בדיקת הבנה בתכנון למידה</h1>
      <noscript>יש להפעיל JavaScript כדי להשתמש בפעילות.</noscript>
      <form id="quiz-form" novalidate>
        <div id="quiz-questions"></div>
        <!-- The open question must meet the submission requirements but adds no points. -->
        <fieldset id="q6" class="question-card">
          <legend>6. כיצד אפשר לחלק שלושה ימי הכנה לבוחן בשלושה נושאים, וכיצד אפשר לבדוק שהחומר הובן? <span class="required-note">(חובה, ללא ניקוד)</span></legend>
          <div class="question-card-body">
            <p id="q6-hint" class="form-hint">יש לכתוב לפחות 15 מילים ולשלב לפחות שני מושגים שונים: יעד לימודי, משימות קטנות, חזרה, תרגול.</p>
            <label for="q6-answer" class="visually-hidden">תוכנית ההכנה בשלושה ימים</label>
            <textarea id="q6-answer" class="form-control" rows="6" required aria-describedby="q6-hint q6-storage q6-feedback"></textarea>
            <p id="q6-storage" class="form-hint">אפשר לכתוב עד 2,000 תווים.</p>
            <div id="q6-feedback" class="quiz-feedback" aria-live="polite"></div>
          </div>
        </fieldset>
        <div class="quiz-actions">
          <button type="submit" class="btn btn-primary">בדיקת תשובות</button>
          <button type="reset" class="btn btn-outline-primary">אפשר לנסות שוב</button>
        </div>
      </form>
      <!-- Show the summary after checking, with guidance or the final score. -->
      <div id="quiz-summary" class="summary-card" hidden>
        <h2 id="summary-heading" tabindex="-1">סיכום התשובות</h2>
        <div id="summary-content"></div>
      </div>
    </main>
    <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/quiz.js"></script>
    <script type="module" src="../js/pencil-cursor.js"></script>
    <script type="module" src="../js/time-picker.js"></script>
  </body>
</html>
